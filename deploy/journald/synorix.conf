# Synorix — taille des journaux systemd (les journaux de l'API et de Celery y vont, stdout/stderr).
# Installé en /etc/systemd/journald.conf.d/synorix.conf. Procédure : VPS.md.
# KVM 2 (disque de 100 Go) : 1 Go (1 % du disque) au lieu de 500 Mo, pour tenir un mois avec les lignes
# `chrono` (une par étape et par AO, quelques centaines d'octets) et les accès de l'API. SystemKeepFree reste à
# 5 Go : le journal s'arrête de grossir bien avant l'alerte disque (80 %).
[Journal]
SystemMaxUse=1G
SystemKeepFree=5G
MaxRetentionSec=1month
