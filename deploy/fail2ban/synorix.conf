# Synorix — fail2ban : bannit une IP après 5 échecs SSH en 10 min, pour 1 h (doublé à chaque récidive).
# Installé en /etc/fail2ban/jail.d/synorix.conf. Le journal de systemd sert de source (Ubuntu 24.04).
[DEFAULT]
backend = systemd
bantime = 1h
bantime.increment = true
findtime = 10m
maxretry = 5

[sshd]
enabled = true
