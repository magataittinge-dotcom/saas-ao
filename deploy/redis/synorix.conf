# Synorix — réglages Redis (broker Celery, limites de débit). Installé en /etc/redis/synorix.conf,
# lu par la dernière ligne de /etc/redis/redis.conf : `include /etc/redis/synorix.conf`
# (la dernière valeur lue l'emporte). Procédure : VPS.md.
maxmemory 128mb
# noeviction : un broker ne doit jamais perdre une tâche en silence ; au plafond, Redis refuse
# l'écriture et l'erreur se voit dans les journaux.
maxmemory-policy noeviction
