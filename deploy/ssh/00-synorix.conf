# Synorix — SSH : clé seulement, jamais root, seul l'utilisateur deploy.
# Installé en /etc/ssh/sshd_config.d/00-synorix.conf. Le préfixe « 00 » compte : sshd garde la PREMIÈRE
# valeur lue, et Ubuntu 24.04 livre 50-cloud-init.conf avec « PasswordAuthentication yes ».
# Toujours `sudo sshd -t` avant de redémarrer ssh, et garder une session ouverte pendant l'essai.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers deploy
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
