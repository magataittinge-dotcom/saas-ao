# Synorix — en-têtes de la page de l'appli (index.html et repli SPA).
# Installé en /etc/nginx/snippets/synorix-entetes.conf.
# Mêmes valeurs que l'API (backend/main.py, SecurityHeadersMiddleware), sauf la CSP, propre au front.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# CSP du front, EN OBSERVATION : le navigateur signale, ne bloque rien. Les rapports arrivent sur
# POST /api/csp-rapport (backend/routers/csp_rapport.py). Passage en mode bloquant : après
# une semaine sans rapport légitime (VPS.md, étape « CSP »).
# Origines établies d'après le code (bloc 6, frontend/tests/csp-origines.test.ts) et vérifiées en mode
# bloquant sur le build, 18 écrans, Clerk et API simulés : 0 violation. Les origines de Clerk
# (clerk.synorix.tech, challenges.cloudflare.com, *.protect.clerk.com, img.clerk.com) viennent de sa
# documentation : à confirmer par les rapports pendant la recette. Clerk de développement
# (*.clerk.accounts.dev) est couvert aussi, tant que l'instance de production (clerk.synorix.tech)
# n'existe pas ; on choisira dev ou prod pour le test avec Ozcan au bloc 12, puis on retirera l'autre.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://clerk.synorix.tech https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; connect-src 'self' https://clerk.synorix.tech https://*.clerk.accounts.dev https://*.protect.clerk.com; img-src 'self' data: blob: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; frame-src blob: https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-rapport" always;
