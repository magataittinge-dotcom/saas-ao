# Synorix — en-têtes de la page de l'appli (index.html et repli SPA).
# Installé en /etc/nginx/snippets/synorix-entetes.conf.
# Mêmes valeurs que l'API (backend/main.py, SecurityHeadersMiddleware), sauf la CSP, propre au front.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# CSP du front, BLOQUANTE (P1-1 de REVUE-FRONT, 12/11/2026) : le navigateur refuse ce qui n'est pas listé, et signale
# chaque refus sur POST /api/csp-rapport (backend/routers/csp_rapport.py). Elle neutralise un script injecté
# (javascript:, script en ligne, origine tierce) : le jeton de session reste à portée de tout script de la page.
# Retour en observation, en une ligne, si une violation légitime apparaît en production (docs/DEPLOYMENT.md, « CSP ») :
#   sudo sed -i 's/Content-Security-Policy /Content-Security-Policy-Report-Only /' /etc/nginx/snippets/synorix-entetes.conf && sudo nginx -t && sudo systemctl reload nginx
# api-adresse.data.gouv.fr : recherche d'une commune ou d'un code postal dans la veille (service public, sans clé ;
# seule la saisie part, sans jeton de connexion : frontend/src/services/adresse.ts).
# Origines établies d'après le code (bloc 6, frontend/tests/csp-origines.test.ts) et vérifiées en mode
# bloquant sur le build (vite preview, API du banc, vraie connexion Clerk de développement) : écrans publics,
# connexion, inscription et écrans de l'appli, clair et nuit, 0 violation (12/11/2026). Les origines de Clerk
# (clerk.synorix.tech, challenges.cloudflare.com, *.protect.clerk.com, img.clerk.com) viennent de sa documentation.
# Clerk de développement (*.clerk.accounts.dev) est couvert aussi, tant que l'instance de production
# (clerk.synorix.tech) n'est pas choisie : le jour où elle l'est, *.clerk.accounts.dev sort de script-src,
# connect-src et frame-src (n'importe qui peut ouvrir une instance sous ce domaine).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://clerk.synorix.tech https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; connect-src 'self' https://clerk.synorix.tech https://*.clerk.accounts.dev https://*.protect.clerk.com:* https://api-adresse.data.gouv.fr; img-src 'self' data: blob: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; frame-src blob: https://*.clerk.accounts.dev https://challenges.cloudflare.com https://*.protect.clerk.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-rapport" always;
