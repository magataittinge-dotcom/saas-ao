# Synorix — mandataire vers l'API (uvicorn sur 127.0.0.1:8000).
# Installé en /etc/nginx/snippets/synorix-proxy.conf. Inclus par les location /api/ du site.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection '';        # keep-alive des flux SSE
proxy_buffering off;                   # SSE + streaming Anthropic
proxy_cache off;                       # jamais de cache des flux
proxy_read_timeout 600s;               # 10 min — longues générations
proxy_send_timeout 600s;
chunked_transfer_encoding on;
gzip off;                              # pas de compression de l'API (BREACH)
