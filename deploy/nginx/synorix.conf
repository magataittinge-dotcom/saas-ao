# Synorix — site nginx. Source de vérité : ce fichier du dépôt (deploy/nginx/synorix.conf).
# Installé en /etc/nginx/sites-available/synorix (procédure : .claude/echange/sprint-ozcan/VPS.md).
# Requiert /etc/nginx/snippets/synorix-entetes.conf (deploy/nginx/synorix-entetes.conf).
#
# Ce que ce fichier règle (bloc 6) :
# - .mjs servi en application/javascript (sinon le worker de pdf.js est refusé par le navigateur) ;
# - fichiers précompressés au build (.gz) servis par gzip_static, compression à la volée en repli ;
# - index.html jamais mis en cache, assets/ à empreinte en cache d'un an ;
# - CSP du front en observation (Content-Security-Policy-Report-Only) dans le snippet ;
# - X-Accel-Redirect pour le document entier de « Voir dans le DCE » (plages HTTP natives) ;
# - corps des requêtes plafonnés comme l'appli : 2 Go pour le dépôt du DCE, 60 Mo ailleurs.

# Débit par IP sur l'API : filet pour les 2 vCPU du KVM 2, en plus des limites de l'appli (slowapi, par
# organisation). Large : une page d'AO précharge 3 requêtes à la fois (bloc 5).
limit_req_zone $binary_remote_addr zone=synorix_api:10m rate=20r/s;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name synorix.tech www.synorix.tech;
    return 301 https://synorix.tech$request_uri;
}

# www → domaine nu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.synorix.tech;
    ssl_certificate     /etc/letsencrypt/live/synorix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synorix.tech/privkey.pem;
    return 301 https://synorix.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synorix.tech;

    ssl_certificate     /etc/letsencrypt/live/synorix.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synorix.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    # Plafond par défaut : les dépôts de l'appli sont à 50 Mo au plus (coffre-fort, DPGF, pièces
    # complétées, import du mémoire), le logo à 5 Mo ; 60 Mo laisse la marge de l'enveloppe multipart.
    client_max_body_size 60m;

    # Front construit, publié par deploy/outils/publier_front.sh (les anciens assets/ restent 7 jours).
    root /srv/synorix/www;
    index index.html;

    # Compression du front : le build dépose un .gz à côté de chaque fichier ; à défaut, à la volée.
    # L'API n'est pas compressée par nginx (réponses JSON avec données de session : BREACH).
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # Brotli : seulement si le module est installé (libnginx-mod-http-brotli-static) — voir VPS.md.
    # brotli_static on;

    # Dépôt du DCE (routers/projects.py : _MAX_UPLOAD_SIZE = 2 Go). Seule route à 2 Go.
    location ~ ^/api/projects/[^/]+/documents$ {
        client_max_body_size 2100m;
        client_body_timeout 120s;
        limit_req zone=synorix_api burst=40 nodelay;
        include /etc/nginx/snippets/synorix-proxy.conf;
    }

    # API — flux SSE (/api/projects/.../progress-stream) et streaming Anthropic : tampon coupé.
    # Ne pas resserrer sans vérifier que la fenêtre de progression avance en temps réel.
    # Les en-têtes de sécurité de l'API sont posés par FastAPI (main.py), pas ici.
    location /api/ {
        limit_req zone=synorix_api burst=40 nodelay;
        include /etc/nginx/snippets/synorix-proxy.conf;
    }

    # Document entier de « Voir dans le DCE » : plages HTTP (pdf.js charge par morceaux).
    # FastAPI vérifie la signature et l'appartenance à l'organisation, puis répond SANS corps avec
    # `X-Accel-Redirect: /_fichiers_internes/<chemin relatif>` (+ Content-Type et
    # Content-Disposition: inline, conservés par nginx) ; nginx envoie le fichier lui-même, avec
    # ses plages natives (206). `internal` : adresse INJOIGNABLE depuis l'extérieur.
    # `alias` se termine par « / » comme la `location`. Réglage côté appli (.env) :
    #   SYNORIX_X_ACCEL_PREFIX=/_fichiers_internes
    # Ne PAS ajouter X-Accel-Redirect à `proxy_ignore_headers`.
    location /_fichiers_internes/ {
        internal;
        alias /srv/synorix/backend/uploads/;
        gzip off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Fichiers à empreinte de Vite (nom-<8 caractères>.ext) : immuables, cache d'un an.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|mjs|css|woff2?|svg|png|webp|jpe?g|gif|ico)$" {
        include /etc/nginx/snippets/synorix-entetes-statiques.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Sans « always » : une 404 ne doit jamais être mise en cache un an.
        # Worker de pdf.js (pdf.worker.min-<empreinte>.mjs) : nginx ne connaît pas l'extension .mjs
        # et l'enverrait en application/octet-stream, que le navigateur refuse pour un module.
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            include /etc/nginx/snippets/synorix-entetes-statiques.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        try_files $uri =404;
    }

    # Autres fichiers de assets/ (copiés de public/, sans empreinte) : un jour.
    location /assets/ {
        include /etc/nginx/snippets/synorix-entetes-statiques.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Page de l'appli (SPA) : jamais en cache, pour qu'un déploiement soit vu tout de suite.
    location = /index.html {
        include /etc/nginx/snippets/synorix-entetes.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/synorix-entetes.conf;
        add_header Cache-Control "no-cache" always;
    }

    access_log /var/log/nginx/synorix.access.log;
    error_log  /var/log/nginx/synorix.error.log;
}
