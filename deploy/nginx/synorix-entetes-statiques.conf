# Synorix — en-têtes des fichiers statiques (JS, CSS, polices, images).
# Installé en /etc/nginx/snippets/synorix-entetes-statiques.conf.
# Rappel nginx : un add_header dans une location annule ceux du niveau au-dessus ; d'où ce snippet.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
