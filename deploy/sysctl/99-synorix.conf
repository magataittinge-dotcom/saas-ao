# Synorix — mémoire virtuelle avec un fichier d'échange de 2 Go (KVM 2, 8 Go de RAM, disque de 100 Go).
# Installé en /etc/sysctl.d/99-synorix.conf. Procédure : VPS.md.
# Le swap sert de coussin contre un pic, pas de mémoire de travail : la somme des plafonds (7100 Mo) tient dans
# 8192 Mo sans lui. 2 Go suffisent (le plus gros enfant est plafonné à 1,5 Go virtuels) ; plus ne ferait que
# retarder un arrêt par manque de mémoire en ralentissant tout.
vm.swappiness = 10
