# Synorix — réglages Postgres pour le KVM 1 (1 vCPU, 4 Go partagés avec l'API, Celery, Redis).
# Installé en /etc/postgresql/<version>/main/conf.d/synorix.conf (Debian/Ubuntu lit conf.d :
# vérifier `include_dir = 'conf.d'` dans postgresql.conf). Procédure : VPS.md.
#
# Connexions : pool SQLAlchemy de 15 par processus (backend/database.py : 10 + 5)
# × (API + worker Celery) = 30, plus psql, sauvegardes et migrations → 50.
max_connections = 50
shared_buffers = 512MB          # redémarrage de Postgres requis
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
# Une session laissée « idle in transaction » bloque les migrations (B5) : coupée après 10 min.
idle_in_transaction_session_timeout = '10min'
