# Synorix — réglages Postgres pour le KVM 2 (2 vCPU, 8 Go partagés avec l'API, Celery, Redis, nginx).
# Installé en /etc/postgresql/<version>/main/conf.d/synorix.conf (Debian/Ubuntu lit conf.d :
# vérifier `include_dir = 'conf.d'` dans postgresql.conf). Procédure : VPS.md.
#
# Budget mémoire de Postgres : 1900 Mo sur les 8192 (somme complète : synorix-api.service).
#   shared_buffers 1024 + ~45 connexions x 6 Mo + 12 tris simultanés x 2 x work_mem 16
#   + autovacuum 3 x 64 + wal_buffers 16  =  ~1890 Mo.
#
# Connexions : pool SQLAlchemy de 15 par processus (backend/database.py : 10 + 5) x (API 1 + enfants du
# worker Celery 2) = 45, plus psql, sauvegarde et migrations (~10) = 55, marge de 25 -> 80.
# Une connexion inactive coûte ~6 Mo : ce plafond n'engage pas la mémoire, il protège contre une fuite de connexions.
max_connections = 80
# 1 Go = 12,5 % de la RAM (règle courante : 25 % au plus, ici le reste sert à l'API et au cache de pages du noyau).
# Les données du premier mois tiennent largement en mémoire. Redémarrage de Postgres requis.
shared_buffers = 1GB
# Indication pour le planificateur seulement (rien n'est alloué) : cache de pages disponible ~ 8192 - 700 (système)
# - 1024 (shared_buffers) - ~1500 (API et worker au repos) - 300 (Redis) ~ 4,6 Go -> 4 Go, par prudence.
effective_cache_size = 4GB
# Par tri ou jointure, par requête : 16 Mo (12 tris simultanés au pire, comptés dans le budget).
work_mem = 16MB
# Index (dont pgvector du RAG) et VACUUM manuels ; un seul à la fois.
maintenance_work_mem = 256MB
# Chaque ouvrier autovacuum borne sa mémoire (sinon il prendrait maintenance_work_mem : 3 x 256 Mo).
autovacuum_work_mem = 64MB
# Disque SSD/NVMe du KVM : lire hors séquence coûte presque autant qu'en séquence (défaut 4.0 pensé pour disque tournant).
random_page_cost = 1.1
effective_io_concurrency = 200
# Journal d'écriture (wal) : checkpoints espacés mais bornés. min 256 Mo évite de recycler trop souvent ;
# max 2 Go borne le disque (100 Go) et la durée de reprise après arrêt brutal ; étalement à 90 % pour lisser les écritures.
min_wal_size = 256MB
max_wal_size = 2GB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
# Une session laissée « idle in transaction » bloque les migrations (B5) : coupée après 10 min.
idle_in_transaction_session_timeout = '10min'
